<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
canvas{position:fixed;inset:0;display:block;width:100vw;height:100vh;height:100dvh;object-fit:contain}

body{touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#tc,#rot{display:none}
#tc{position:fixed;inset:0;pointer-events:none}
#tc *{pointer-events:auto}
#tc b{position:absolute;display:flex;align-items:center;justify-content:center;border-radius:50%;
  background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.45);color:#fff;font:bold clamp(11px,2.6dvh,16px) sans-serif}
#tc b.on{background:rgba(255,255,255,.5)}
#stick{position:absolute;left:max(var(--g),env(safe-area-inset-left));bottom:max(var(--g),env(safe-area-inset-bottom));width:var(--s);height:var(--s);border-radius:50%;
  background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.35)}
#knob{position:absolute;left:30%;top:30%;width:40%;height:40%;border-radius:50%;background:rgba(255,255,255,.4);pointer-events:none!important}
#btns{position:absolute;right:max(var(--g),env(safe-area-inset-right));bottom:max(var(--g),env(safe-area-inset-bottom));width:calc(var(--s)*1.1);height:calc(var(--s)*1.1)}
#btns b{width:46%;height:46%}
#top{position:absolute;top:max(6px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;gap:10px}
#top b{position:static;width:clamp(32px,9dvh,44px);height:clamp(32px,9dvh,44px);font-size:16px}
#rot{position:fixed;inset:0;background:#000;color:#fff;font:bold 22px sans-serif;align-items:center;justify-content:center;text-align:center;z-index:9}
@media (pointer:coarse){#tc{display:block}}
@media (pointer:coarse) and (orientation:portrait){#rot{display:flex}}

'use strict';
// Browser port of the Unity SF6Clone. 60fps fixed step; world units (1u = U px), y up from floor.

const keys=new Set();
addEventListener('keydown',e=>{
  if(/^(Arrow|Space|Tab|Numpad)/.test(e.code)||e.code==='Semicolon')e.preventDefault();
  if(!e.repeat){keys.add(e.code);onKey(e.code);}
});
addEventListener('keyup',e=>keys.delete(e.code));
addEventListener('blur',()=>keys.clear());
// touch controls: synthesize P1 key codes so menus and fights reuse the keyboard path
{
  const press=c=>{if(!keys.has(c)){keys.add(c);onKey(c);}};
  for(const b of document.querySelectorAll('#tc b[data-k]')){
    const k=b.dataset.k,up=()=>{keys.delete(k);b.classList.remove('on');};
    b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);b.classList.add('on');press(k);});
    b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);
  }
  const st=document.getElementById('stick'),kn=document.getElementById('knob'),DIRS=['KeyW','KeyA','KeyS','KeyD'];
  const stick=e=>{
    const r=st.getBoundingClientRect(),R=r.width/2;
    let dx=e.clientX-r.left-R,dy=e.clientY-r.top-R;const m=Math.hypot(dx,dy);if(m>R){dx*=R/m;dy*=R/m;}
    kn.style.transform=`translate(${dx}px,${dy}px)`;
    const t=R*.35,on={KeyW:dy<-t,KeyS:dy>t,KeyA:dx<-t,KeyD:dx>t};
    for(const k of DIRS)on[k]?press(k):keys.delete(k);
  };
  const stop=()=>{kn.style.transform='';for(const k of DIRS)keys.delete(k);};
  st.addEventListener('pointerdown',e=>{e.preventDefault();st.setPointerCapture(e.pointerId);stick(e);});
  st.addEventListener('pointermove',e=>{if(st.hasPointerCapture(e.pointerId))stick(e);});
  st.addEventListener('pointerup',stop);st.addEventListener('pointercancel',stop);
  const de=document.documentElement,fsReq=de.requestFullscreen||de.webkitRequestFullscreen,fs=document.getElementById('fs');
  if(!fsReq)fs.remove(); // iPhone Safari has no element fullscreen; Add to Home Screen covers it
  else fs.addEventListener('pointerup',()=>{
    if(document.fullscreenElement||document.webkitFullscreenElement)(document.exitFullscreen||document.webkitExitFullscreen).call(document);
    else Promise.resolve(fsReq.call(de)).then(()=>screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape')).catch(()=>{});
  });
  addEventListener('contextmenu',e=>e.preventDefault());
  // iOS ignores user-scalable=no: block double-tap and pinch zoom on the game surface
  for(const ev of ['touchstart','touchend','gesturestart','dblclick'])document.addEventListener(ev,e=>e.preventDefault(),{passive:false});
}

  {u:['KeyW'],d:['KeyS'],l:['KeyA'],r:['KeyD'],b:[['KeyJ'],['KeyK'],['KeyL'],['Semicolon']]},

];
const any=a=>a.some(k=>keys.has(k));
const NEUTRAL={x:0,y:0,b:[false,false,false,false]};
function readPad(i){
  const g=(navigator.getGamepads?navigator.getGamepads():[])[i];if(!g)return null;
  const B=n=>!!(g.buttons[n]&&g.buttons[n].pressed),ax=g.axes[0]||0,ay=g.axes[1]||0;
  // X/Y/B/A = L/M/H/S, LB = throw, RB = parry, RT = drive impact
  return {x:(B(15)||ax>.5?1:0)-(B(14)||ax<-.5?1:0),y:(B(12)||ay<-.5?1:0)-(B(13)||ay>.5?1:0),
    b:[B(2)||B(4),B(3)||B(4)||B(5),B(1)||B(5)||B(7),B(0)||B(7)]};
}
function readHuman(p){
  const m=KB[p],r={x:(any(m.r)?1:0)-(any(m.l)?1:0),y:(any(m.u)?1:0)-(any(m.d)?1:0),b:m.b.map(any)};
  const g=readPad(p);
  if(g){if(g.x)r.x=g.x;if(g.y)r.y=g.y;r.b=r.b.map((v,i)=>v||g.b[i]);}
  return r;
}
const toNum=(r,f)=>5+r.x*f+(r.y>0?3:r.y<0?-3:0);  // numpad notation relative to facing

function seqMatch(h,seq,win){let i=seq.length-1;for(let k=h.length-1;k>=0&&k>=h.length-win;k--)if(h[k].d===seq[i]&&--i<0)return true;return false;}
function charge(h,dirs,need,grace=10){let k=h.length-1,g=0;while(k>=0&&!dirs.includes(h[k].d)&&g<grace){k--;g++;}let n=0;while(k>=0&&dirs.includes(h[k].d)){n++;k--;}return n>=need;}
function spin(h,win){const s=new Set();for(let k=Math.max(0,h.length-win);k<h.length;k++){const d=h[k].d;if(BACK.includes(d))s.add('b');if(FWD.includes(d))s.add('f');if(DOWN.includes(d))s.add('d');if(UP.includes(d))s.add('u');}return s.size===4;}

function popup(f,text,color){game.pops.push({x:f.x,y:f.y+2.3,text,color,t:60});}
function spark(pt,color,n){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=2+Math.random()*6;game.parts.push({x:pt.x,y:pt.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,t:14+Math.random()*10,color,size:2+Math.random()*4});}}
function hitstop(a,b,n){if(a)a.hitstop=Math.max(a.hitstop,n);b.hitstop=Math.max(b.hitstop,n);}
const overlap=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
const contact=(a,b)=>({x:(Math.max(a.x,b.x)+Math.min(a.x+a.w,b.x+b.w))/2,y:(Math.max(a.y,b.y)+Math.min(a.y+a.h,b.y+b.h))/2});
const atWall=f=>f.x<=.6||f.x>=SW-.6;

class Fighter{
  constructor(def,idx){this.def=def;this.idx=idx;this.maxHp=def.hp||10000;this.superM=0;this.wins=0;this.hist=[];this.reset();}
  reset(){
    Object.assign(this,{x:SW/2+(this.idx?2.6:-2.6),y:0,vx:0,vy:0,push:0,facing:this.idx?-1:1,state:'idle',sf:0,
      hp:this.maxHp,dispHp:this.maxHp,drive:60000,burnout:false,move:null,mf:0,stun:0,hitstop:0,inv:0,throwInv:0,
      combo:0,comboDmg:0,comboShow:0,juggle:0,hard:false,airActed:false,jdir:0,drBonus:0,landRec:0,
      crouchBlock:false,crouchHit:false,hitCount:0,rehit:0,connected:false,armorUsed:0,idleT:0,d:5,hold:[false,false,false,false],prevB:[false,false,false,false]});
    this.hist.length=0;
  }
  get opp(){return game.f[1-this.idx];}
  feed(r){const p=r.b.map((v,i)=>v&&!this.prevB[i]);this.prevB=r.b.slice();this.hold=r.b;this.d=toNum(r,this.facing);this.hist.push({d:this.d,p});if(this.hist.length>90)this.hist.shift();}
  pressed(b,n=3){for(let k=this.hist.length-1;k>=0&&k>=this.hist.length-n;k--)if(this.hist[k].p[b])return true;return false;}
  consume(...bs){for(let k=Math.max(0,this.hist.length-5);k<this.hist.length;k++)for(const b of bs)this.hist[k].p[b]=false;}
  set(s){this.state=s;this.sf=0;}
  canDrive(){return !this.burnout&&this.drive>0;}
  spend(n){this.drive-=n;if(this.drive<=0){this.drive=0;this.burnout=true;popup(this,'BURNOUT','#aaa');}}
  motion(k){const h=this.hist,d=this.d;switch(k){
    case 'QCF':return seqMatch(h,[2,3,6],15);case 'QCB':return seqMatch(h,[2,1,4],15);
    case 'DP':return d===3&&seqMatch(h,[6,2,3],15);
    case 'CBF':return FWD.includes(d)&&charge(h,BACK,40);case 'CDU':return UP.includes(d)&&charge(h,DOWN,40);
    case '360':return spin(h,30);}}
  startMove(m){this.drBonus=this.state==='driveRush'?4:0;if(this.drBonus)this.push=this.facing*.06;
    this.move=m;this.mf=0;this.hitCount=0;this.rehit=0;this.connected=false;this.armorUsed=0;this.set('attack');
    if(m.inv)this.inv=m.inv;game.last[this.idx]=m;}
  doSuper(){this.superM-=10000;const m=this.def.sup;this.startMove(m);this.inv=m.su+m.ac+4;game.freeze=45;game.freezeBy=this;popup(this,m.name.toUpperCase(),'#ffd23a');}
  // cancel: null = neutral, 'normal' = cancel from a normal, 'special' = cancel from a special (supers only)
  tryActions(c){return this.trySpecial(c)||(!c&&this.tryPairs())||this.tryDR(c)||this.tryNormal(c);}
  trySpecial(c){
    if(!this.pressed(3)||this.y>.01)return false;
    if(this.superM>=10000&&seqMatch(this.hist,[2,3,6,2,3,6],34)){this.consume(3);this.doSuper();return true;}
    if(c==='special')return false;
    for(const k of this.def.order)if(this.motion(k)){const m=this.def.sp[k];this.consume(3);
      if(m.proj&&game.proj.some(p=>p.owner===this))return false;  // one projectile at a time
      this.startMove(m);return true;}
    return false;
  }
  tryPairs(){
    if(this.y>.01)return false;const P=b=>this.pressed(b,3);
    if(P(2)&&P(3)&&this.canDrive()){this.consume(2,3);this.spend(20000);this.startMove(DI);popup(this,'DRIVE IMPACT','#f55');return true;}
    if(P(1)&&P(2)&&this.canDrive()){this.consume(1,2);this.move=null;this.set('parry');return true;}
    if(P(0)&&P(1)){this.consume(0,1);this.move=null;this.set('throwStart');return true;}
    return false;
  }
  tryDR(c){
    if(c==='special'||this.y>.01||!this.pressed(3)||this.d!==6||!this.canDrive())return false;
    this.consume(3);this.spend(c?30000:20000);this.move=null;this.set('driveRush');popup(this,'DRIVE RUSH','#3f8');return true;
  }
  tryNormal(c){
    if(c==='special')return false;const air=this.y>.01;if(air&&this.airActed)return false;
    const h=this.hist,n=h.length;
    for(const b of [2,1,0]){
      // 1-frame delay on normals gives two-button commands (throw/parry/DI) a leniency window
      if(!((n>1&&h[n-2].p[b])||(n>2&&h[n-3].p[b])))continue;
      let m=this.def.n[(air?'j':DOWN.includes(this.d)?'c':'s')+'LMH'[b]];
      if(!air&&b===2&&this.d===6&&this.def.n.fH)m=this.def.n.fH;
      if(c==='normal'&&!(this.move&&this.move.slot&&this.move.slot[1]==='L'&&b===0))return false; // light chains
      this.consume(b);this.startMove(m);if(air)this.airActed=true;return true;
    }
    return false;
  }
  neutralMove(){
    const d=this.d;let s='idle';
    if(UP.includes(d)){this.jdir=d===9?1:d===7?-1:0;this.set('prejump');return;}
    if(DOWN.includes(d))s='crouch';else if(d===6)s='walkF';else if(d===4)s='walkB';
    if(s!==this.state)this.set(s);
  }
  grab(range,dmg,techable){
    const o=this.opp;
    if(Math.abs(o.x-this.x)>range||o.y>.01||o.inv>0||o.throwInv>0||['hitstun','blockstun','launched','knockdown','getup','ko','koDown','thrown','throwing'].includes(o.state))return false;
    if(techable&&o.state==='throwStart'&&o.sf<=5){tech(this,o);return true;}
    this.set('throwing');this.throwDmg=dmg;this.throwCmd=!techable;this.throwBack=techable&&BACK.includes(this.d);
    o.set('thrown');o.techable=techable;o.move=null;o.push=0;o.x=this.x+this.facing*.85;
    return true;
  }
  update(){
    if(this.hitstop>0){this.hitstop--;return;}
    this.sf++;if(this.inv>0)this.inv--;if(this.throwInv>0)this.throwInv--;if(this.comboShow>0)this.comboShow--;
    const o=this.opp;
    if(FACE.has(this.state)&&this.y<=.01)this.facing=this.x<o.x?1:this.x>o.x?-1:this.facing;
    if(ACTIONABLE.has(this.state)&&this.combo){this.combo=0;this.juggle=0;}
    if(!['driveRush','parry'].includes(this.state)&&!(this.move&&this.move.type==='di')){
      this.drive=Math.min(60000,this.drive+(this.burnout?50:40));if(this.burnout&&this.drive>=60000)this.burnout=false;}
    switch(this.state){
      case 'idle':case 'walkF':case 'walkB':case 'crouch':if(!this.tryActions(null))this.neutralMove();break;
      case 'prejump':if(this.trySpecial(null))break;
        if(this.sf>=4){this.vy=this.def.jump;this.vx=this.jdir*this.facing*this.def.jumpX;this.y=.01;this.airActed=false;this.set('air');}break;
      case 'air':this.tryNormal(null);break;
      case 'land':if(this.sf>=(this.landRec||4)){this.landRec=0;this.set('idle');}break;
      case 'attack':this.attackUpdate();break;
      case 'blockstun':
        if(this.pressed(2)&&this.pressed(3)&&this.canDrive()){this.consume(2,3);this.spend(20000);this.startMove(DREV);this.inv=DREV.su+DREV.ac;popup(this,'DRIVE REVERSAL','#3f8');break;}
        // fallthrough
      case 'hitstun':if(--this.stun<=0){this.set('idle');this.throwInv=4;}break;
      case 'knockdown':if(--this.stun<=0){this.set('getup');this.inv=14;}break;
      case 'getup':if(this.sf>=12)this.set('idle');break;
      case 'throwStart':if(this.sf===5&&!this.grab(1.1,1200,true))this.set('throwWhiff');break;
      case 'throwWhiff':if(this.sf>=22)this.set('idle');break;
      case 'throwing':this.throwUpdate();break;
      case 'thrown':this.push=0;if(o.state!=='throwing'){this.set('idle');break;}
        if(this.techable&&this.sf<=8&&this.pressed(0,4)&&this.pressed(1,4))tech(o,this);break;
      case 'driveRush':this.x+=this.facing*(this.sf<16?12:5)*DT;
        if(this.sf%2)game.parts.push({x:this.x-this.facing*.3,y:1+Math.random(),vx:-this.facing*2,vy:0,t:14,color:'#3f8',size:5});
        if(this.sf>=9&&this.tryActions(null))break;if(this.sf>=24)this.set('idle');break;
      case 'parry':this.drive-=60;if(this.drive<=0){this.drive=0;this.burnout=true;}
        if(((!this.hold[1]||!this.hold[2])&&this.sf>=10)||this.sf>=80||this.burnout)this.set('parryRec');break;
      case 'parryRec':if(this.sf>=8)this.set('idle');break;
    }
    this.physics();
  }
  attackUpdate(){
    const m=this.move;this.mf++;if(this.rehit>0)this.rehit--;
    const act=m.su+m.ac;
    if(m.dx&&this.mf<=act)this.x+=this.facing*m.dx*DT;
    if(m.rise&&this.mf===m.su+1){this.vy=m.rise;this.y=.01;this.vx=this.facing*1.5;}
    if(m.proj&&this.mf===m.su)spawnProj(this,m);
    if(m.cmd&&this.mf===m.su+1&&this.grab(m.cmd,m.dmg,false))return;
    if(this.mf>act+m.rc){this.move=null;if(this.y>.01){this.airActed=true;this.set('air');}else this.set('idle');return;}
    if(this.connected&&this.mf<=act+14){const c=m.type==='normal'?'normal':m.type==='special'?'special':null;if(c)this.tryActions(c);}
  }
  throwUpdate(){
    const o=this.opp;
    if(this.sf<24){if(o.state!=='thrown'){this.set('idle');return;}o.x=this.x+this.facing*.85;if(this.throwCmd)o.y=Math.min(1.2,this.sf*.06);return;}
    if(this.sf===24&&o.state==='thrown'){
      if(this.throwBack)o.x=this.x-this.facing*.85;
      const dir=Math.sign(o.x-this.x)||this.facing,dmg=Math.round(this.throwDmg*Math.max(.1,1-.1*o.combo));
      o.hp-=dmg;o.combo++;o.comboDmg=(o.combo===1?0:o.comboDmg)+dmg;o.comboShow=120;
      this.superM=Math.min(30000,this.superM+dmg*.5);
      o.y=Math.max(o.y,.01);o.vy=this.throwCmd?4:7;o.vx=dir*4;o.hard=true;o.juggle=4;
      if(o.hp<=0&&game.mode!=='training'){o.hp=0;o.set('ko');}else{o.hp=Math.max(1,o.hp);o.set('launched');}
      hitstop(this,o,10);game.shake=12;spark({x:o.x,y:o.y+1},'#fff',16);
    }
    if(this.sf>=34)this.set('idle');
  }
  physics(){
    if(this.state==='thrown')return;
    if(this.y>.001||this.vy>0){
      this.vy-=GRAV*DT;this.x+=this.vx*DT;this.y+=this.vy*DT;
      if(this.y<=0){this.y=0;this.vy=0;this.vx=0;this.onLand();}
    }else if(this.state==='walkF')this.x+=this.facing*this.def.walk*DT;
    else if(this.state==='walkB')this.x-=this.facing*this.def.walk*.8*DT;

    const cr=this.state==='crouch'||(this.state==='attack'&&this.move&&this.move.slot&&this.move.slot[0]==='c')||(this.state==='blockstun'&&this.crouchBlock)||(this.state==='hitstun'&&this.crouchHit);

function tech(a,b){for(const f of [a,b]){f.move=null;f.set('blockstun');f.stun=16;f.crouchBlock=false;f.push=-f.facing*.12;}popup(b,'THROW TECH','#fff');}

function spawnProj(A,m){
  const p=m.proj;
  game.proj.push({owner:A,mv:m,x:clamp(A.x+A.facing*(p.at??1.0),.5,SW-.5),y:A.y+(p.y??1.1),vx:A.facing*p.spd,w:p.w,h:p.h,
    life:p.life??240,hits:p.hits??1,hp:p.hits??1,hitCount:0,rehit:0,color:p.color,facing:A.facing,t:0});
}
const prect=p=>({x:p.x-p.w/2,y:p.y-p.h/2,w:p.w,h:p.h});

function canBlock(B,m,airAtk){
  if(B.y>.01||!['idle','walkB','crouch','blockstun'].includes(B.state)||!BACK.includes(B.d))return false;
  const cr=B.d===1;
  if(m.low&&!cr)return false;
  if((m.oh||airAtk)&&cr)return false;
  B.crouchBlock=cr;return true;
}

function resolveHit(A,B,m,p,final,pt){
  const dir=p?(Math.sign(p.vx)||p.facing):A.facing,nh=p?p.hits:(m.hits||1),per=Math.round(m.dmg/nh),sA=p?null:A;
  if(B.state==='parry'){B.drive=Math.min(60000,B.drive+3000);hitstop(sA,B,12);popup(B,'PARRY','#5cf');spark(pt,'#5cf',14);B.set('idle');if(!p)A.connected=true;return;}
  if(B.state==='attack'&&B.move.armor&&B.armorUsed<B.move.armor&&B.mf<=B.move.su+B.move.ac){
    B.armorUsed++;B.hp=Math.max(1,B.hp-Math.round(per*.5));hitstop(sA,B,14);popup(B,'ARMOR','#f55');spark(pt,'#f55',10);if(!p)A.connected=true;return;}
  const wall=atWall(B);
  if(canBlock(B,m,!p&&A.y>.05)&&!(m.type==='di'&&wall)){
    const chip=m.type==='normal'?0:Math.round(per*.15);
    B.hp=Math.max(m.type==='super'?0:1,B.hp-chip);
    if(!B.burnout)B.spend(m.type==='di'?5000:per*.6);
    B.set('blockstun');B.move=null;B.stun=m.bs+(A.drBonus&&m.type==='normal'?4:0)+(B.burnout?4:0)+(nh>1?4:0);
    B.push=dir*Math.min(.14,.03+m.kx*.008);
    A.superM=Math.min(30000,A.superM+per*.3);
    hitstop(sA,B,nh>1?5:8);spark(pt,'#8cf',6);if(!p)A.connected=true;return;
  }
  const counter=B.state==='attack'&&B.mf<=B.move.su+B.move.ac;
  const punish=(B.state==='attack'&&!counter)||B.state==='throwWhiff'||B.state==='parryRec';
  const dmg=Math.max(1,Math.round(per*Math.max(.1,1-.1*B.combo)*(counter||punish?1.2:1)));
  B.hp-=dmg;B.combo++;B.comboDmg=(B.combo===1?0:B.comboDmg)+dmg;B.comboShow=120;
  if(m.type!=='super')A.superM=Math.min(30000,A.superM+dmg*.6);
  if(!A.burnout)A.drive=Math.min(60000,A.drive+dmg*.5);
  B.superM=Math.min(30000,B.superM+dmg*.25);
  if(counter)popup(B,'COUNTER','#ffd23a');else if(punish)popup(B,'PUNISH COUNTER','#ff8a2a');
  if(!p)A.connected=true;
  B.move=null;
  const air=B.y>.05||B.state==='launched',ch=counter||punish;
  let stop=nh>1&&!final?5:Math.min(16,9+Math.floor(per/250))+(ch?3:0);if(m.type==='super'&&final)stop=20;
  if(B.hp<=0){
    if(game.mode==='training')B.hp=1;
    else{B.hp=0;B.set('ko');B.vy=9;B.vx=dir*4;B.y=Math.max(B.y,.01);hitstop(sA,B,24);game.shake=20;spark(pt,'#fff',30);return;}
  }
  if(final&&m.type==='di'&&wall){B.set('launched');B.vy=3;B.vx=-dir*1.5;B.hard=true;B.y=Math.max(B.y,.01);B.juggle++;popup(B,'WALL SPLAT','#f55');}
  else if(final&&m.type==='di'&&ch){B.set('hitstun');B.stun=55;B.push=dir*.05;popup(B,'CRUMPLE','#f55');}
  else if(final&&(m.launch||(m.cc&&ch)||air)){B.set('launched');B.vy=m.ky>0?m.ky:(air?6:9);B.vx=dir*Math.max(1.5,m.kx*.35);B.hard=!!m.kd;B.y=Math.max(B.y,.01);B.juggle++;if(m.cc&&ch&&!m.launch)popup(B,'CRUSH COUNTER','#f5a');}
  else if(final&&m.kd){B.set('launched');B.vy=4;B.vx=dir*2;B.hard=true;B.y=.01;B.juggle++;}
  else if(air){B.set('launched');B.vy=3;B.vx=dir;B.y=Math.max(B.y,.01);}
  else{B.set('hitstun');B.stun=m.hs+(counter?2:0)+(punish?4:0)+(A.drBonus&&m.type==='normal'?4:0);if(nh>1&&!final)B.stun=Math.max(B.stun,14);
    B.push=dir*Math.min(.14,.03+m.kx*.008);B.crouchHit=B.d<=3;}
  hitstop(sA,B,stop);spark(pt,ch?'#ffd23a':'#fff',nh>1?6:12);game.shake=Math.max(game.shake,Math.min(10,stop-6));
}

function collide(){
  const fs=game.f,hits=[];
  for(const A of fs){
    const B=A.opp,m=A.move;
    if(A.state!=='attack'||!m||m.proj||m.cmd||A.mf<=m.su||A.mf>m.su+m.ac||A.hitCount>=(m.hits||1)||A.rehit>0||A.hitstop>0)continue;
    const hb=A.hitRect(m),hu=B.hurt();
    if(!hu||B.inv>0||(B.state==='launched'&&B.juggle>=4))continue;
    if(overlap(hb,hu))hits.push([A,B,m,contact(hb,hu)]);
  }
  for(const[A,B,m,pt]of hits){A.hitCount++;A.rehit=Math.max(3,Math.floor(m.ac/(m.hits||1)));resolveHit(A,B,m,null,A.hitCount>=(m.hits||1),pt);}
  const P=game.proj;
  for(const p of P){p.t++;p.x+=p.vx*DT;if(--p.life<=0||p.x<-1||p.x>SW+1)p.dead=true;if(p.rehit>0)p.rehit--;}
  for(const a of P)for(const b of P)if(a!==b&&a.owner!==b.owner&&!a.dead&&!b.dead&&overlap(prect(a),prect(b))){
    a.hp--;b.hp--;if(a.hp<=0)a.dead=true;if(b.hp<=0)b.dead=true;spark(contact(prect(a),prect(b)),'#fff',10);}
  for(const p of P){
    if(p.dead||p.rehit>0)continue;
    const B=p.owner.opp,hu=B.hurt();
    if(!hu||B.inv>0||(B.state==='launched'&&B.juggle>=4))continue;
    const r=prect(p);
    if(overlap(r,hu)){p.hitCount++;p.rehit=6;resolveHit(p.owner,B,p.mv,p,p.hitCount>=p.hits,contact(r,hu));if(p.hitCount>=p.hits)p.dead=true;}
  }
  game.proj=P.filter(p=>!p.dead);
}

function separate(){
  const[a,b]=game.f,lo=.5,hi=SW-.5;
  for(const f of game.f){ // corner pushback transfers to the attacker
    if(f.x<lo){const o=lo-f.x;f.x=lo;if(f.push<0&&f.opp.y<.01)f.opp.x+=o;}
    if(f.x>hi){const o=f.x-hi;f.x=hi;if(f.push>0&&f.opp.y<.01)f.opp.x-=o;}
  }
  const skip=s=>['thrown','throwing','knockdown','koDown'].includes(s);
  if(skip(a.state)||skip(b.state))return;
  const md=.32*(a.def.size+b.def.size),dx=b.x-a.x;
  if(Math.abs(dx)<md&&Math.abs(a.y-b.y)<1.3){
    const s=dx>0?1:dx<0?-1:a.facing,ov=(md-Math.abs(dx))/2;a.x-=s*ov;b.x+=s*ov;
    if(a.x<lo||a.x>hi){a.x=clamp(a.x,lo,hi);b.x=a.x+s*md;}
    if(b.x<lo||b.x>hi){b.x=clamp(b.x,lo,hi);a.x=b.x-s*md;}
  }
}

// ---------------- CPU / dummy ----------------
class CPU{
  constructor(){this.q=[];this.cool=40;this.blockDec=undefined;}
  seq(dirs,btn){const e=dirs.map(d=>({d}));e[e.length-1].b=btn;this.q.push(...e.slice(1));return e[0];}
  get(me,op){return fromNum(this.q.length?this.q.shift():this.think(me,op),me.facing);}
  think(me,op){
    const dist=Math.abs(op.x-me.x),R=Math.random,sp=me.def.sp;
    const threat=(op.state==='attack'&&op.move&&op.mf<=op.move.su+op.move.ac&&dist<3.4)||
      game.proj.some(p=>p.owner===op&&Math.abs(p.x-me.x)<4&&Math.sign(me.x-p.x)===Math.sign(p.vx||me.x-p.x));
    if(me.state==='blockstun')return {d:me.crouchBlock?1:4};
    if(threat){if(this.blockDec===undefined)this.blockDec=R()<.7;if(this.blockDec)return {d:op.move&&op.move.low?1:4};}else this.blockDec=undefined;
    if(!ACTIONABLE.has(me.state))return {d:5};
    if(op.y>.8&&op.vy<4&&dist<3&&R()<.15){
      if(sp.DP)return this.seq([6,2,3,3],'S');if(sp.CDU)return this.seq([...Array(42).fill(2),8],'S');return this.seq([2,2],'H');}
    if(--this.cool>0)return {d:dist>4?6:5};
    this.cool=10+(R()*25|0);
    const r=R(),fb=sp.QCF&&sp.QCF.proj?()=>this.seq([2,2,3,3,6,6],'S'):sp.CBF?()=>this.seq([...Array(44).fill(4),6],'S'):null;
    const jumpIn=()=>this.seq([9,...Array(24).fill(5),5],'H');
    if(me.superM>=10000&&dist<2.5&&R()<.25)return this.seq([2,3,6,2,3,6,6],'S');
    if(dist>4.5){
      if(fb&&r<.35)return fb();
      if(r<.45)return jumpIn();
      return this.seq(Array(20).fill(6));
    }
    if(dist>2.2){
      if(r<.3)return this.seq(Array(14).fill(6));
      if(r<.42&&me.drive>30000){const e=this.seq([6,6],'S');this.q.push(...Array(10).fill({d:5}),{d:5,b:'M'});return e;}
      if(r<.55&&fb)return fb();
      if(r<.65)return jumpIn();
      if(r<.8)return this.seq([2,2],'M');
      return this.seq(Array(12).fill(4));
    }
    if(sp['360']&&r<.2)return this.seq([6,3,2,1,4,7,8],'S');
    if(r<.35){const e=this.seq([2,2],'M');const fin=sp.QCF?[2,2,3,3,6,6]:sp.QCB?[2,2,1,1,4,4]:[2,2];this.q.push(...Array(6).fill({d:2}),...fin.map(d=>({d})));this.q[this.q.length-1]={d:fin[fin.length-1],b:'S'};return e;}
    if(r<.5){const e=this.seq([5,5],'L');this.q.push({d:5},{d:5},{d:5},{d:5,b:'L'},{d:5},{d:5},{d:5},{d:5,b:'L'});return e;}
    if(r<.6)return this.seq([5,5],'LM');
    if(r<.7)return this.seq([5,5],'H');
    if(r<.76&&me.drive>20000)return this.seq([5,5],'HS');
    if(r<.88)return this.seq(Array(15).fill(4));
    return this.seq(Array(10).fill(4));
  }
}
function dummyInput(me,op){
  switch(DUMMY[game.t.dummy]){
    case 'crouch':return {x:0,y:-1,b:[0,0,0,0]};
    case 'jump':return {x:0,y:1,b:[0,0,0,0]};
    case 'block':return {x:-me.facing,y:op.move&&op.move.low?-1:0,b:[0,0,0,0]};
    case 'cpu':return game.cpu.get(me,op);
  }
  return NEUTRAL;
}
function getInputs(){
  const t=game.t;let r0=readHuman(0),r1;
  if(game.mode==='pvp')r1=readHuman(1);
  else if(game.mode==='cpu')r1=game.cpu.get(game.f[1],game.f[0]);
  else if(t.recording){r1=r0;r0=NEUTRAL;t.rec.push({x:r1.x*game.f[1].facing,y:r1.y,b:r1.b.slice()});}
  else if(t.playing&&t.rec.length){const e=t.rec[t.pi++%t.rec.length];r1={x:e.x*game.f[1].facing,y:e.y,b:e.b};}
  else r1=dummyInput(game.f[1],game.f[0]);
  return game.phase==='fight'?[r0,r1]:[NEUTRAL,NEUTRAL];
}

// ---------------- flow ----------------
function startMatch(){
  const s=game.sel;game.f=[new Fighter(CH[s.c[0]],0),new Fighter(CH[s.c[1]],1)];
  game.cpu=new CPU();game.round=1;game.t.rec=[];game.t.recording=game.t.playing=false;game.paused=false;
  startRound();game.scene='fight';
}
function startRound(){
  for(const f of game.f)f.reset();
  game.proj=[];game.pops=[];game.timer=99*60;game.freeze=0;
  game.phase=game.mode==='training'?'fight':'intro';game.phaseT=0;
}
function endRound(){
  const[a,b]=game.f;game.phase='ko';game.phaseT=0;
  game.koText=a.hp<=0&&b.hp<=0?'DOUBLE K.O.':game.timer<=0?'TIME':'K.O.';
  if(a.hp!==b.hp)(a.hp>b.hp?a:b).wins++;
}
function step(){
  for(const p of game.parts){p.x+=p.vx*DT;p.y+=p.vy*DT;p.vy-=10*DT;p.t--;}
  game.parts=game.parts.filter(p=>p.t>0);
  for(const p of game.pops){p.t--;p.y+=.012;}
  game.pops=game.pops.filter(p=>p.t>0);
  if(game.shake>0)game.shake--;
  if(game.scene!=='fight'||game.paused)return;
  if(game.freeze>0){game.freeze--;return;}
  game.phaseT++;
  if(game.phase==='intro'&&game.phaseT>=100){game.phase='fight';game.phaseT=0;}
  if(game.phase==='ko'&&game.phaseT<60&&game.phaseT%3)return; // KO slow-mo
  const ins=getInputs();game.f.forEach((f,i)=>f.feed(ins[i]));
  for(const f of game.f)f.update();
  collide();separate();
  const t=game.t;
  if(game.mode==='training'){
    for(const f of game.f){
      if(t.inf){f.superM=30000;if(f.state!=='parry'&&f.state!=='driveRush'){f.drive=60000;f.burnout=false;}}
      if(ACTIONABLE.has(f.state)&&f.combo===0){if(++f.idleT>40)f.hp=f.maxHp;}else f.idleT=0;
    }
    return;
  }
  if(game.phase==='fight'){
    if(--game.timer<=0||game.f.some(f=>f.hp<=0))endRound();
  }else if(game.phase==='ko'&&game.phaseT>=170){
    const w=game.f.find(f=>f.wins>=2);
    if(w){game.winner=w.idx;game.scene='result';}else{game.round++;startRound();}
  }
}

// ---------------- keys for menus ----------------
const MENU=['VS CPU','VS PLAYER 2','TRAINING','CONTROLS'];
function onKey(c){
  const conf=['KeyJ','Enter','Space'].includes(c);
  if(game.scene==='menu'){
    if(c==='KeyW'||c==='ArrowUp')game.menuI=(game.menuI+3)%4;
    if(c==='KeyS'||c==='ArrowDown')game.menuI=(game.menuI+1)%4;
    if(conf){if(game.menuI===3){game.scene='controls';return;}
      game.mode=['cpu','pvp','training'][game.menuI];game.sel={c:[game.sel.c[0],game.sel.c[1]],done:[false,false],phase:0};game.scene='select';}
  }else if(game.scene==='controls'){if(conf||c==='Escape')game.scene='menu';}
  else if(game.scene==='select')selKey(c);
  else if(game.scene==='result'){if(conf)game.scene='select',game.sel.done=[false,false],game.sel.phase=0;}
  else if(game.scene==='fight'){
    if(c==='Escape'){game.scene='menu';return;}
    if(game.mode!=='training'){if(c==='KeyP')game.paused=!game.paused;return;}
    const t=game.t;
    if(c==='KeyH')t.hb=!t.hb;
    if(c==='KeyF')t.fd=!t.fd;
    if(c==='KeyB')t.dummy=(t.dummy+1)%DUMMY.length;
    if(c==='KeyM')t.inf=!t.inf;
    if(c==='KeyR'){startRound();}
    if(c==='ControlLeft'||c==='ControlRight'){t.playing=false;if(t.recording)t.recording=false;else{t.rec=[];t.recording=true;}}
    if(c==='ShiftLeft'||c==='ShiftRight'){t.recording=false;t.playing=!t.playing&&t.rec.length>0;t.pi=0;}
  }
}
function selKey(c){
  const s=game.sel,solo=game.mode!=='pvp',p0=solo?s.phase:0;
  const move=(p,dx,dy)=>{if(s.done[p])return;const i=s.c[p];s.c[p]=(((i/3|0)+dy+2)%2)*3+((i%3)+dx+3)%3;};
  if(c==='Escape'){game.scene='menu';return;}
  if(c==='KeyA')move(p0,-1,0);if(c==='KeyD')move(p0,1,0);if(c==='KeyW')move(p0,0,-1);if(c==='KeyS')move(p0,0,1);
  if(c==='KeyJ'||(solo&&(c==='Enter'||c==='Space'))){s.done[p0]=true;if(solo&&s.phase===0)s.phase=1;}
  if(!solo){
    if(c==='ArrowLeft')move(1,-1,0);if(c==='ArrowRight')move(1,1,0);if(c==='ArrowUp')move(1,0,-1);if(c==='ArrowDown')move(1,0,1);
    if(['Numpad4','Digit7','Enter'].includes(c))s.done[1]=true;
  }
  if(s.done[0]&&s.done[1])startMatch();
}

function ik(a,b,l,dir){const dx=b[0]-a[0],dy=b[1]-a[1],dd=Math.hypot(dx,dy)||1e-3;if(dd>=2*l)return [(a[0]+b[0])/2,(a[1]+b[1])/2];
  const h=Math.sqrt(l*l-dd*dd/4);return [(a[0]+b[0])/2-dy/dd*h*dir,(a[1]+b[1])/2+dx/dd*h*dir];}
function limb(a,b,l,dir,w,c,dark){const j=ik(a,b,l,dir);for(const col of dark?[c,'rgba(0,0,0,.35)']:[c]){ctx.strokeStyle=col;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(j[0],j[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();}}

const lerp2=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t];

  }
}
function drawFight(){
  const sh=game.shake>0?(Math.random()-.5)*game.shake*1.2:0;
  ctx.setTransform(1,0,0,1,sh,sh*.5);
  ctx.drawImage(bg,0,0);
  if(game.freeze>0){ctx.fillStyle='rgba(0,0,10,.6)';ctx.fillRect(-20,-20,W+40,H+40);}
  const same=game.f[0].def===game.f[1].def;
  [...game.f].sort((a,b)=>(a.state==='attack')-(b.state==='attack')).forEach(f=>drawFighter(f,same&&f.idx===1));
  game.proj.forEach(drawProj);
  ctx.save();ctx.globalCompositeOperation='lighter';
  for(const p of game.parts){ctx.globalAlpha=Math.min(1,p.t/10);ctx.fillStyle=p.color;ctx.fillRect(p.x*U-p.size/2,GROUND-p.y*U-p.size/2,p.size,p.size);}
  ctx.restore();
  for(const p of game.pops){ctx.globalAlpha=Math.min(1,p.t/20);text(p.text,p.x*U,GROUND-p.y*U,26,p.color);ctx.globalAlpha=1;}
  if(game.mode==='training'&&game.t.hb)for(const f of game.f){
    const hu=f.hurt();if(hu)rectPx(hu,f.inv>0?'#88f':'#3f6');
    const m=f.move;if(f.state==='attack'&&m&&!m.proj&&f.mf>m.su&&f.mf<=m.su+m.ac)rectPx(f.hitRect(m),'#f33');
    for(const p of game.proj)rectPx(prect(p),'#f33');
  }
  ctx.setTransform(1,0,0,1,0,0);
  drawHUD();
}
function drawMenu(){
  ctx.drawImage(bg,0,0);ctx.fillStyle='#0009';ctx.fillRect(0,0,W,H);
  text('SF6 CLONE',W/2,170,110,'#ffd23a');text('fan-made browser edition',W/2,245,22,'#ccc',undefined,false);
  MENU.forEach((m,i)=>text((i===game.menuI?'▶ ':'')+m,W/2,340+i*62,40,i===game.menuI?'#fff':'#888'));
  text('W/S or arrows to move · J / Enter to select',W/2,H-40,18,'#aaa',undefined,false);
}
function drawControls(){
  ctx.fillStyle='#111';ctx.fillRect(0,0,W,H);text('CONTROLS',W/2,60,56,'#ffd23a');
  const L=[['','P1','P2'],['Move','W A S D','Arrow keys'],['Light / Medium / Heavy','J / K / L','Num4 Num5 Num6  (or 7 8 9)'],['Special','; (semicolon)','Num+  (or 0)'],
    ['Throw','L + M',''],['Parry (hold)','M + H',''],['Drive Impact','H + S',''],['Drive Rush','6 + S  (also cancels normals on hit)',''],
    ['Drive Reversal','H + S while blocking',''],['Super (1 bar)','QCF QCF + S',''],['Block','hold back (down-back for lows)',''],
    ['Gamepad','X/Y/B/A = L/M/H/S · LB throw · RB parry · RT DI',''],['Pause / Menu','P / Esc','']];
  ctx.font='20px monospace';ctx.textBaseline='middle';
  L.forEach((r,i)=>{ctx.fillStyle=i?'#ddd':'#ffd23a';ctx.textAlign='left';ctx.fillText(r[0],80,130+i*40);ctx.fillText(r[1],400,130+i*40);ctx.fillText(r[2],880,130+i*40);});
  text('Motions are relative to facing: QCF = ↓↘→, QCB = ↓↙←, DP = →↓↘, [4]6 = hold back 40f then forward',W/2,H-50,18,'#aaa',undefined,false);
  text('J / Esc to return',W/2,H-22,16,'#888',undefined,false);
}
function drawSelect(){
  ctx.fillStyle='#14101c';ctx.fillRect(0,0,W,H);
  const s=game.sel,solo=game.mode!=='pvp';
  text('SELECT YOUR FIGHTER',W/2,50,48,'#ffd23a');
  text(solo?(s.phase===0?'Pick your fighter (WASD + J)':'Pick the opponent (WASD + J)'):'P1: WASD + J    P2: Arrows + Num4/7/Enter',W/2,92,20,'#ccc',undefined,false);
  CH.forEach((c,i)=>{
    const x=140+(i%3)*250,y=130+(i/3|0)*250;
    ctx.fillStyle='#221c2e';ctx.fillRect(x,y,220,230);
    const sel=[0,1].filter(p=>s.c[p]===i&&(!solo||p<=s.phase||s.done[p]));
    sel.forEach(p=>{ctx.strokeStyle=p?'#4af':'#f44';ctx.lineWidth=s.done[p]?6:3;ctx.strokeRect(x+p*6,y+p*6,220-p*12,230-p*12);});
    ctx.save();ctx.beginPath();ctx.rect(x,y,220,230);ctx.clip();
    drawFighter({def:c,x:(x+110)/U,y:(GROUND-(y+200))/U,facing:1,state:'idle',sf:0,inv:0,hitstop:0,move:null},false);
    ctx.restore();
    text(c.name,x+110,y+20,26,'#fff');text(c.arch,x+110,y+214,16,'#bbb',undefined,false);
  });
  const show=CH[s.c[solo?s.phase:0]];
  ctx.fillStyle='#000a';ctx.fillRect(900,130,340,480);
  text(show.name,1070,165,36,'#ffd23a');
  ctx.font='16px monospace';ctx.textAlign='left';ctx.fillStyle='#ddd';
  show.moves.forEach((m,i)=>ctx.fillText(m,915,215+i*30));
  ctx.fillStyle='#888';ctx.fillText('S = Special button',915,215+show.moves.length*30+20);
  if(!solo){const p2=CH[s.c[1]];ctx.fillStyle='#4af';ctx.fillText('P2: '+p2.name,915,560);}
  text('Esc: back',W/2,H-24,16,'#888',undefined,false);
}
function drawResult(){
  drawFight();ctx.fillStyle='#000a';ctx.fillRect(0,0,W,H);
  const w=game.f[game.winner];
  text((game.mode==='cpu'&&w.idx===1?'CPU':'P'+(w.idx+1))+' WINS',W/2,H/2-40,100,'#ffd23a');
  text(w.def.name,W/2,H/2+40,40,'#fff');
  text('J / Enter to continue',W/2,H/2+110,22,'#ccc',undefined,false);
}
function render(){
  ctx.setTransform(1,0,0,1,0,0);
  ({menu:drawMenu,controls:drawControls,select:drawSelect,fight:drawFight,result:drawResult})[game.scene]();
}

// ---------------- self-check (motion parser) ----------------
(function(){
  const H=ds=>ds.map(d=>({d,p:[0,0,0,0]}));
  console.assert(seqMatch(H([5,2,3,6]),[2,3,6],15),'QCF');
  console.assert(!seqMatch(H([5,2,1,4]),[2,3,6],15),'QCB is not QCF');
  console.assert(seqMatch(H([6,5,2,3]),[6,2,3],15),'DP');
  console.assert(charge(H([...Array(45).fill(4),6]),BACK,40),'charge');
  console.assert(!charge(H([...Array(20).fill(4),6]),BACK,40),'short charge');
  console.assert(spin(H([6,3,2,1,4,7,8]),30),'360');
  console.assert(toNum({x:1,y:-1},1)===3&&toNum({x:1,y:-1},-1)===1,'numpad');
  console.assert(fromNum({d:3},-1).x===-1,'fromNum');
})();

let acc=0,last=performance.now();
function frame(t){acc+=Math.min(100,t-last);last=t;while(acc>=1000/60){step();acc-=1000/60;}render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);
</script>
